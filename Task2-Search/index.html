<!DOCTYPE html>

<head>

    <title>Search Products</title>

    <script src="https://cdn.tailwindcss.com"></script>

<body class="min-h-screen bg-[#f5f7f5]">

    <div class="mx-auto max-w-4xl px-5 py-16">
        <div class="mb-10 text-center">
            <p class="mb-2 text-sm font-medium uppercase tracking-[0.2em] text-[#9ACD32]">
                Explore

                Search Fruits

            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
                🔍
            </span>

            <input type="text"
                class="search-input w-full rounded-xl border border-gray-200 bg-white py-4 pl-11 pr-5 text-gray-700 shadow-sm outline-none transition placeholder:text-gray-400 focus:border-[#9ACD32] focus:ring-2 focus:ring-[#9ACD32]/20"
                placeholder="Search fruits...">
